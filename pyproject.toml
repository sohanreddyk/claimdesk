# Tool configuration only (the project is run from source, not installed as a package).

[tool.pytest.ini_options]
pythonpath = ["apps/insurance_claims"]
testpaths = ["apps/insurance_claims/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
